<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#e3f2fd;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:350px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h2{
            text-align:center;
            margin-bottom:20px;
            color:#1565c0;
        }

        label{
            display:block;
            margin-top:10px;
            margin-bottom:5px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:10px;
            border:1px solid gray;
            border-radius:5px;
        }

        input:focus{
            outline:none;
            border:2px solid #1565c0;
        }

        button{
            width:100%;
            margin-top:20px;
            padding:10px;
            border:none;
            background:#1565c0;
            color:white;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#0d47a1;
        }

        p{
            text-align:center;
            margin-top:15px;
        }

        a{
            text-decoration:none;
            color:#1565c0;
            font-weight:bold;
        }

        a:hover{
            text-decoration:underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Login Form</h2>

        <form>

            <label>Username / Email</label>
            <input type="text" placeholder="Enter Username or Email">

            <label>Password</label>
            <input type="password" placeholder="Enter Password">

            <button type="submit">Login</button>

        </form>

        <p>
            New User?
            <a href="registration.html">Register Here</a>
        </p>

    </div>

</body>

</html>
